# SPDX-License-Identifier: GPL-3.0-or-later
# Firmware (all models + unit tests) and the Flatpak (app + its tests).
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Unit tests (lib/clockcore)
        run: pio test -e native
      - name: Build firmware for all clocks
        run: pio run -e EleksTube -e EleksTube_Gen2 -e SI_HAI -e PunkCyber
      - name: Collect firmware bundle
        run: python scripts/collect_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-bundle
          path: dist/firmware

  flatpak:
    needs: firmware
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bundle
          path: dist/firmware
      # Builds the app and runs its tests (run-tests in the manifest).
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: TubeClock.flatpak
          manifest-path: packaging/flatpak/io.github.OesusDevelopmentStudios.TubeClock.yml
          cache-key: flatpak-builder-${{ github.sha }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [firmware, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-bundle
          path: firmware-bundle
      - uses: actions/download-artifact@v4
        with:
          pattern: "*flatpak*"
          path: flatpak
          merge-multiple: true
      - name: Package firmware bundle
        run: cd firmware-bundle && zip -r ../tubeclock-firmware-${GITHUB_REF_NAME}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            tubeclock-firmware-*.zip
            flatpak/*.flatpak
          generate_release_notes: true
