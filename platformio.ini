; Tube Clock firmware - PlatformIO project
;
; Supported clocks (EleksTube family, 4 MB flash, 4 buttons):
;   EleksTube       original EleksTube IPS (DS3231 RTC)
;   EleksTube_Gen2  EleksTube IPS Gen2 / Classic / Pro / PR1 / PR2 (DS3231 RTC)
;   SI_HAI          Si Hai copy (DS1302 RTC)
;   PunkCyber       PunkCyber / RGB Glow Tube / PCBway (tubes in reversed order)
;
; Host-side unit tests of lib/clockcore:   pio test -e native
; Firmware bundle for the desktop app:      python3 scripts/collect_firmware.py

[platformio]
default_envs = EleksTube

; Common settings for all firmware environments
[firmware]
platform = espressif32 @ ^7.0.1
framework = arduino
board = esp32dev
board_build.partitions = partition_4MB.csv
board_build.filesystem = littlefs
upload_speed = 460800 ; CH340 adapters on these clocks are not reliable at 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; TFT_eSPI, RTC_DS1302 etc. are listed for reference. lib/modified_TFT_eSPI is a locally
; patched copy of bodmer/TFT_eSPI@2.5.43 and is picked up automatically from lib/.
lib_deps =
  adafruit/Adafruit NeoPixel @ ^1.12.0
  bblanchon/ArduinoJson @ ^7.4.2
  makuna/RTC @ ^2.5.0
  adafruit/RTClib @ ^2.1.4
  kikuchan98/pngle @ ^1.1.0

build_flags =
  -D BUILDVER=2.0.0 ; Firmware version, reported by /api/info
  -D CORE_DEBUG_LEVEL=0
  -D PNGLE_NO_GAMMA_CORRECTION

extra_scripts =
  pre:scripts/script_rename_firmware.py ; firmware file name <env>_v<BUILDVER>
  pre:scripts/script_configure_tft_lib.py ; copy GLOBAL_DEFINES.hpp into TFT_eSPI as User_Setup.h

[env:EleksTube]
extends = firmware
build_flags = ${firmware.build_flags} -D HARDWARE_ELEKSTUBE_CLOCK

[env:EleksTube_Gen2]
extends = firmware
build_flags = ${firmware.build_flags} -D HARDWARE_ELEKSTUBE_GEN2_CLOCK

[env:SI_HAI]
extends = firmware
build_flags = ${firmware.build_flags} -D HARDWARE_SI_HAI_CLOCK

[env:PunkCyber]
extends = firmware
build_flags = ${firmware.build_flags} -D HARDWARE_PUNKCYBER_CLOCK

; Unit tests of the hardware independent logic (lib/clockcore) on the build host.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -D PNGLE_NO_GAMMA_CORRECTION
lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  kikuchan98/pngle @ ^1.1.0
lib_ignore = modified_TFT_eSPI
